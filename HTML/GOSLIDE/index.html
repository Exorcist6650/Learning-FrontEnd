<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>GoSlide</title>
  </head>
  <body>
    <header class="header">
      <a class="header-logo" href="#">
        <img class="header-logo-icon" src="assets/images/logo.svg" alt="" />
        <span class="header-brand">GoSlide</span>
      </a>

      <nav class="nav">
        <a class="nav-link" href="#">Overview</a>
        <a class="nav-link" href="#">Features</a>
        <a class="nav-link" href="#">Technology</a>
        <a class="nav-link" href="#">Design</a>
        <a class="nav-link" href="#">Review</a>
        <a class="nav-link" href="#">Pricing</a>
      </nav>

      <a class="btn" href="#" class="order-btn">
        <img class="btn-icon" src="assets/images/order-icon.svg" alt="" />
        order now
      </a>
    </header>

    <section class="hero">
      <div class="container">
        <h1 class="hero-title">SLIDe CONTROL</h1>
        <img class="hero-image" src="assets/images/mouse 1.png" alt="" />

        <div class="hero-text">
          <div class="hero-text-col">
            <dl class="hero-list">
              <dt class="hero-list-title">weight</dt>
              <dd class="hero-list-text">55g</dd>
            </dl>
          </div>
          <div class="hero-text-col">
            <dl class="hero-list hero-list--right">
              <dt class="hero-list-title">resolution</dt>
              <dd class="hero-list-text">100-20 000 DPI</dd>
            </dl>
          </div>
        </div>

        <div class="hero-footer">
          <a class="btn btn--large btn--shadow" href="#">
            <img class="btn-icon" src="assets/images/play-icon.svg" alt="" />
            play video
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
